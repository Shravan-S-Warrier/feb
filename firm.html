<!DOCTYPE html>
<html>
<head>
  <title>Firm Decision</title>
  <style>
    body {
      background: linear-gradient(135deg, #fddb92, #d1fdff);
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    button {
      padding: 12px 24px;
      margin: 15px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .yes { background: #ff3366; color: white; }
    .no { background: #ccc; }

    /* 🔽 NEW: Popup styles */
    .popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup-box {
      background: white;
      padding: 22px;
      border-radius: 14px;
      width: 280px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .popup-box h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>

  <h2>
    Hey meri dilli waali girlfriend 🤍  
    <br><br>
    You are a firm lady, stern in your decisions.  
    <br>
    I like that 😌  
    <br><br>
    To make it easy, I won’t tell anyone that you clicked No first hihi
  </h2>

  <div>
    <button class="yes" onclick="location.href='yes.html'">Yes 💕</button>
    <button class="no" onclick="showWarning()">No 😤</button>
  </div>

  <!-- 🔽 NEW: Custom popup -->
  <div id="popup" class="popup">
    <div class="popup-box">
      <h3>Shravan pleads 💬</h3>
      <p>
        Just like Dustin pleaded with Steve to stay, I’m asking you to please click Yes 😭❤️<br>
        I can’t code beyond this!
      </p>
      <button onclick="closePopup()">Owwww.....my loving babes</button>
    </div>
  </div>

  <!-- 🔽 UPDATED JS -->
  <script>
    function showWarning() {
      document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>

</body>
</html>
